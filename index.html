<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juego 3 en Línea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">

                        <h1 class="h3 text-center mb-4">Juego 3 en Línea</h1>

                        <div class="input-group mb-2">
                            <span class="input-group-text px-3"><img src="img/X.png" alt="X" width="32" height="32"></span>
                            <input type="text" id="jugadorX" class="form-control text-center" value="" placeholder="Jugador X">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text px-3"><img src="img/O.png" alt="O" width="32" height="32"></span>
                            <input type="text" id="jugadorO" class="form-control text-center" value="" placeholder="Jugador O">
                        </div>

                        <div class="d-grid mb-3">
                            <button type="button" id="btnIniciar" class="btn btn-primary rounded-pill" onclick="iniciar()">Iniciar Juego</button>
                        </div>

                        <p id="turno" class="fw-semibold fs-5 text-center mb-3">Turno: </p>

                        <div id="mensaje"></div>

                        <div class="row row-cols-3 g-2">
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c00" class="btn btn-light border p-2" onclick="jugada(0,0)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c01" class="btn btn-light border p-2" onclick="jugada(0,1)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c02" class="btn btn-light border p-2" onclick="jugada(0,2)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c10" class="btn btn-light border p-2" onclick="jugada(1,0)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c11" class="btn btn-light border p-2" onclick="jugada(1,1)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c12" class="btn btn-light border p-2" onclick="jugada(1,2)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c20" class="btn btn-light border p-2" onclick="jugada(2,0)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c21" class="btn btn-light border p-2" onclick="jugada(2,1)"></button></div></div>
                            <div class="col"><div class="ratio ratio-1x1"><button type="button" id="c22" class="btn btn-light border p-2" onclick="jugada(2,2)"></button></div></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        
// MATRIZ DEL TABLERO
var tablero = [
    [0, 0, 0],
    [0, 0, 0],
    [0, 0, 0]
];

// VARIABLES DEL JUEGO
var sw = 1;
var jugadas = 0;
var activo = false;

var nombres = {
    1: "",
    2: ""
};

var imagenes = {
    1: "img/X.png",
    2: "img/O.png"
};

// CREAR Y REINICIAR TABLERO
function crearTablero() {
    for (var f = 0; f < 3; f++) {
        for (var c = 0; c < 3; c++) {
            var boton = document.getElementById("c" + f + c);
            boton.innerHTML = "";
        }
    }
}

// REGISTRAR JUGADORES
function registrarJugadores() {
    var x = document.getElementById("jugadorX").value.trim();
    var o = document.getElementById("jugadorO").value.trim();

    if (x === "" || o === "") {
        alert("Escribe el nombre de los dos jugadores");
        return false;
    }

    nombres[1] = x;
    nombres[2] = o;

    return true;
}

// MOSTRAR TURNO
function mostrarTurno() {
    var simbolo = (sw === 1) ? "X" : "O";

    document.getElementById("turno").textContent =
        "Turno: " + nombres[sw] + " (" + simbolo + ")";
}

// CAMBIAR TURNO
function cambiarTurno() {
    sw = (sw === 1) ? 2 : 1;
    mostrarTurno();
}

// REGISTRAR JUGADAS
function jugada(f, c) {

    if (!activo || tablero[f][c] !== 0) {
        return;
    }

    tablero[f][c] = sw;

    var boton = document.getElementById("c" + f + c);
    var img = document.createElement("img");

    img.src = imagenes[sw];
    img.alt = (sw === 1) ? "X" : "O";
    img.className = "img-fluid";

    boton.appendChild(img);

    jugadas++;

    // VERIFICAR GANADOR
    if (verificar(sw)) {
        activo = false;

        var mensaje = "Ganó " + nombres[sw];

        document.getElementById("turno").textContent = mensaje;

        setTimeout(function () {
            alert(mensaje);
        }, 100);

        return;
    }

    // VERIFICAR EMPATE
    if (jugadas === 9) {
        activo = false;

        document.getElementById("turno").textContent = "Empate";

        setTimeout(function () {
            alert("Empate");
        }, 100);

        return;
    }

    // CAMBIAR TURNO
    cambiarTurno();
}

// VERIFICAR GANADOR
function verificar(j) {
    var t = tablero;

    for (var i = 0; i < 3; i++) {

        // VERIFICAR FILAS
        if (t[i][0] === j && t[i][1] === j && t[i][2] === j) {
            return true;
        }

        // VERIFICAR COLUMNAS
        if (t[0][i] === j && t[1][i] === j && t[2][i] === j) {
            return true;
        }
    }

    // VERIFICAR DIAGONAL PRINCIPAL
    if (t[0][0] === j && t[1][1] === j && t[2][2] === j) {
        return true;
    }

    // VERIFICAR DIAGONAL INVERSA
    if (t[0][2] === j && t[1][1] === j && t[2][0] === j) {
        return true;
    }

    return false;
}

// INICIAR NUEVA PARTIDA
function iniciar() {

    if (!registrarJugadores()) {
        return;
    }

    tablero = [
        [0, 0, 0],
        [0, 0, 0],
        [0, 0, 0]
    ];

    sw = 1;
    jugadas = 0;
    activo = true;

    crearTablero();
    mostrarTurno();
}
 
    </script>

</body>
</html>
